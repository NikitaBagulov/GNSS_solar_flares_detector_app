name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Deploy on server runner
        run: |
          cd "/home/user/app/GNSS_solar_flares_detector_app"
          ./deploy/deploy.sh "${{ github.sha }}"
