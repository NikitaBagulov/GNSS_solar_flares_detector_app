name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Results server smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/gnss-results"
          python results_server.py \
            --directory "$RUNNER_TEMP/gnss-results" \
            --bind 127.0.0.1 \
            --port 18000 \
            >"$RUNNER_TEMP/results-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            curl --fail --silent http://127.0.0.1:18000/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/results-server.log"
          exit 1
