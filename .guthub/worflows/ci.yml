name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax and server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile results server
        run: python -m py_compile results_server.py

      - name: Start results server
        run: |
          mkdir -p /tmp/gnss-results
          python results_server.py \
            --directory /tmp/gnss-results \
            --bind 127.0.0.1 \
            --port 18000 \
            >/tmp/gnss-results-server.log 2>&1 &
          echo $! >/tmp/gnss-results-server.pid

      - name: Health check
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/gnss-results-server.log
          exit 1

      - name: Stop results server
        if: always()
        run: |
          if test -f /tmp/gnss-results-server.pid; then
            kill "$(cat /tmp/gnss-results-server.pid)" || true
          fi